# Physical parameters of the Crazyflie 2.1 (+ Flow deck v2).
#
# This is the ONLY place where physical parameters live. Every entry has:
#   value   numeric value (scalar or list)
#   unit    SI unit
#   source  where the number comes from (key into `sources` below)
#   status  constant | datasheet | literature | assumed | own_id
#             constant   = physical constant
#             datasheet  = manufacturer number
#             literature = measured by someone else on a Crazyflie 2.0/2.1
#             assumed    = placeholder guess, MUST be replaced by own_id
#                          before any hardware flight that depends on it
#             own_id     = measured by us on our own vehicle
#
# Values marked `literature` were identified on a Crazyflie 2.0 (same frame
# and motor size as the 2.1). They are starting values for simulation and
# get replaced by `own_id` values in the identification phase.
#
# Derived quantities (hover thrust, arm projection on body axes, ...) are
# NOT stored here; they are computed in code from these entries.

sources:
  bitcraze_cf21: "Bitcraze, Crazyflie 2.1 datasheet (bitcraze.io)"
  bitcraze_flow: "Bitcraze, Flow deck v2 datasheet (bitcraze.io)"
  foerster2015: "J. Foerster, System Identification of the Crazyflie 2.0 Nano Quadrocopter, BSc thesis, ETH Zurich, 2015"
  standard: "Standard physical constant"
  cf_firmware: "Crazyflie firmware: motor command is a uint16 (github.com/bitcraze/crazyflie-firmware)"
  cf_firmware_thrust: "Crazyflie firmware, src/platform/interface/platform_defaults_cf2.h and src/drivers/src/motors.c (commit 2248ed2, 2026-10-02)"
  cf_firmware_flow: "Crazyflie firmware, optical flow measurement model (src/modules/src/kalman_core/mm_flow.c)"
  placeholder: "Placeholder guess, no source yet. To be identified (see docs/identification.md)"

environment:
  gravity:
    value: 9.81
    unit: m/s^2
    source: standard
    status: constant

body:
  mass_base:
    # Bare Crazyflie 2.1 takeoff weight, with stock battery.
    value: 0.027
    unit: kg
    source: bitcraze_cf21
    status: datasheet
  mass_flow_deck:
    value: 0.0016
    unit: kg
    source: bitcraze_flow
    status: datasheet
  motor_to_motor_diagonal:
    # Diagonal distance between motor axes (datasheet "92 mm motor to motor").
    # Arm length from center = half of this. X configuration.
    value: 0.092
    unit: m
    source: bitcraze_cf21
    status: datasheet
  inertia:
    # Full inertia tensor about the center of mass, body frame, row-major 3x3.
    value: [1.6571710e-5, 0.0830806e-5, 0.0718277e-5,
            0.0830806e-5, 1.6655602e-5, 0.1800197e-5,
            0.0718277e-5, 0.1800197e-5, 2.9261652e-5]
    unit: kg*m^2
    source: foerster2015
    status: literature

rotor:
  thrust_coefficient:
    # Thrust per motor: F = k_f * omega^2, omega in rpm.
    value: 3.16e-10
    unit: N/rpm^2
    source: foerster2015
    status: literature
  torque_coefficient:
    # Drag torque per motor: M = k_m * omega^2, omega in rpm.
    value: 7.94e-12
    unit: N*m/rpm^2
    source: foerster2015
    status: literature
  thrust_command_model:
    # How the firmware turns the 16-bit thrust command (0..65535) into thrust.
    #   battery_compensated: F = cmd / thrust_cmd_max * max_thrust_per_motor
    #                        (firmware default for Crazyflie 2.x since 2025,
    #                        CONFIG_ENABLE_THRUST_BAT_COMPENSATED=y)
    #   pwm_polynomial:      F = c2*cmd^2 + c1*cmd + c0 (thrust_pwm_poly),
    #                        older firmware / compensation disabled.
    # Check which one your firmware uses before flying.
    value: battery_compensated
    unit: "-"
    source: cf_firmware_thrust
    status: literature
  thrust_cmd_max:
    value: 65535
    unit: "-"
    source: cf_firmware
    status: datasheet
  max_thrust_per_motor:
    # THRUST_MAX for "2.1+" and "legacy" propellers (same value).
    value: 0.12
    unit: N
    source: cf_firmware_thrust
    status: literature
  min_thrust_per_motor:
    # THRUST_MIN: commands below this thrust switch the motor off.
    value: 0.012817578393224994
    unit: N
    source: cf_firmware_thrust
    status: literature
  thrust_pwm_poly:
    # Only used with thrust_command_model = pwm_polynomial.
    # F = c2 * cmd^2 + c1 * cmd + c0 per motor, listed as [c2, c1, c0].
    value: [2.130295e-11, 1.032633e-6, 5.484560e-4]
    unit: N
    source: foerster2015
    status: literature
  motor_time_constant:
    # First-order lag between commanded and actual rotor thrust.
    # Used only by the simulator plant, not by the MPC.
    value: 0.03
    unit: s
    source: placeholder
    status: assumed

inner_loop:
  # Closed-loop response of the onboard (firmware) attitude controller,
  # modelled as a first-order lag: d(phi)/dt = (phi_cmd - phi) / tau.
  # This is what the MPC prediction model assumes about the inner loop.
  attitude_time_constant:
    value: 0.1
    unit: s
    source: placeholder
    status: assumed

sensors:
  flow_npix:
    # Number of pixels of the PMW3901 flow sensor along one axis, as used
    # in the firmware flow model.
    value: 35.0
    unit: "-"
    source: cf_firmware_flow
    status: literature
  flow_thetapix:
    # Field of view of the flow sensor along one axis.
    value: 0.71674
    unit: rad
    source: cf_firmware_flow
    status: literature
