# MPC tuning. NOT physical parameters (those are in model/params.yaml).
# Changing anything here requires re-running generate_solver.py, because
# horizon, sample time, weights and bounds are baked into the solver.

sample_time: 0.02          # s   (50 Hz)
horizon_steps: 25          # -   (0.5 s look-ahead)

# Diagonal state weights, order [px, py, pz, vx, vy, vz, phi, theta]
# Roll/pitch get no weight: penalising them makes the MPC "speed up" the
# onboard attitude loop by feeding back the estimated angle, which together
# with the radio delay excites a ~3 Hz oscillation (seen in simulation).
state_weights: [5.0, 5.0, 40.0, 1.0, 1.0, 4.0, 0.0, 0.0]
# Diagonal input weights, order [phi_cmd, theta_cmd, thrust_delta]
# (thrust_delta is in N and much smaller than 1, so its weight is larger)
# Equivalent LQR gains: 0.40 rad/m and 0.37 rad/(m/s) horizontally. Higher
# gains amplify the EKF velocity noise (~5 cm/s) into visible tilt jitter.
input_weights: [30.0, 30.0, 200.0]

# Input bounds
max_tilt: 0.35             # rad (20 deg), applies to phi_cmd and theta_cmd
min_thrust_ratio: 0.3      # -   min total thrust as a fraction of hover thrust
max_thrust_ratio: 0.85     # -   max total thrust as a fraction of max thrust
                           #     (headroom for the onboard attitude controller)

# Yaw is not in the MPC: yaw_rate_cmd = yaw_gain * (yaw_ref - yaw)
yaw_gain: 2.0              # 1/s
max_yaw_rate: 1.0          # rad/s
